name: Sync GitHub Pages mirror

# Реальный трафик kodeksdeneg.ru идёт через Cloudflare DNS на GitHub Pages
# отдельного репозитория balibudda/kodeksdeneg-web (обход блокировки Vercel IP в РФ),
# а не напрямую на Vercel. Этот workflow держит зеркало актуальным при каждом пуше в main.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodeksdeneg
        uses: actions/checkout@v4

      - name: Build dist/
        run: node scripts/build.mjs

      - name: Checkout kodeksdeneg-web mirror
        uses: actions/checkout@v4
        with:
          repository: balibudda/kodeksdeneg-web
          token: ${{ secrets.MIRROR_PUSH_TOKEN }}
          path: mirror

      - name: Sync dist/ into mirror (preserving CNAME)
        run: |
          find mirror -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'CNAME' -exec rm -rf {} +
          cp -R dist/. mirror/

      - name: Commit and push mirror
        working-directory: mirror
        run: |
          git config user.name "kodeksdeneg-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Зеркало уже актуально, коммит не нужен"
            exit 0
          fi
          git commit -m "Автосинхронизация с main@${{ github.sha }}"
          git push origin main
